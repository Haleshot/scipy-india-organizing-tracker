[project]
name = "scipy-india-meeting-notes-graph"
version = "0.1.0"
description = "SciPy India meeting notes + volunteer coordination knowledge graph, built on CocoIndex and Neo4j."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[neo4j,google_drive,sentence_transformers,entity_resolution_llm]>=1.0.7",
    "instructor",
    "litellm",
    "pydantic",
    "pyyaml",
    "neo4j",
]

[project.optional-dependencies]
# The MCP server and its retrieval layer. Separate from the pipeline: you can
# run the pipeline without ever installing this, and vice versa.
mcp = ["mcp>=2.0"]
# Local embeddings for hybrid search. Already pulled in by cocoindex's
# sentence_transformers extra; named here so the search path is installable
# on its own.
search = ["sentence-transformers>=3.0"]
dev = ["pytest", "pytest-asyncio", "ruff", "mcp>=2.0"]

[project.scripts]
# Both wrap the same read-only retrieval layer. The MCP entry point is what a
# client such as Claude Desktop launches; see README, "Connecting Claude".
scipy-india-query = "scipy_india_kg.query:main"
scipy-india-mcp = "scipy_india_kg.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# So `pytest` works straight from a clone, editable install or not.
pythonpath = ["src"]
