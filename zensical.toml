# Zensical builds docs/ into a static site. The dashboard under web/public is a
# separate thing with its own deployment; these two do not share assets.
#
#   zensical serve    preview at http://localhost:8000
#   zensical build    writes site/

[project]
site_name = "SciPy India organizing graph"
site_description = "Turning the SciPy India meeting notes into a graph the organizing team can query."
site_url = "https://haleshot.github.io/meeting-notes-graph/"
site_author = "SciPy India organizers"
copyright = "SciPy India"

repo_url = "https://github.com/Haleshot/meeting-notes-graph"
repo_name = "Haleshot/meeting-notes-graph"
edit_uri = "edit/main/docs/"

# Grouped the way somebody arrives at it: set it up, then use it, then look
# something up, then find out why it works the way it does.
nav = [
  { "Home" = "index.md" },
  { "Understanding it" = [
    "reading-the-dashboard.md",
    "how-ai-is-used.md",
    "privacy.md",
  ] },
  { "Running your own" = [
    "get-started.md",
    "connecting-sources.md",
    "writing-notes.md",
    "refreshing.md",
    "neo4j-desktop.md",
    "asking-questions.md",
    "publishing.md",
  ] },
  { "Reference" = [
    "graph-model.md",
    "design.md",
  ] },
]

extra_css = ["assets/scipy.css"]

[project.theme]
language = "en"
logo = "assets/scipy-india-logo.svg"
favicon = "assets/scipy-india-logo.svg"
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# One accent, taken from the SciPy logo, in both schemes. No second colour and
# no gradient: this is documentation, and the link colour is the only thing that
# needs to stand out.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/scipy-india"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://scipy.in/2026"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
