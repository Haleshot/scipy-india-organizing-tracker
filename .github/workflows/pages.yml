name: Deploy to GitHub Pages

# One Pages site, two things on it:
#
#   /       the dashboard, served from web/public exactly as it sits in the repo
#   /docs/  the Zensical documentation
#
# A repository gets one Pages deployment, so publishing these separately would
# mean each overwriting the other. They are assembled into one directory instead.
#
# The dashboard uses the snapshot committed at web/public/data/graph.json, so no
# credentials, no Neo4j and no model are needed to deploy. To publish real data,
# run ./scripts/refresh.sh locally, commit the regenerated graph.json, and push.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # No neo4j driver on purpose. Nothing in this job talks to a database:
        # the checks read the committed snapshot, and the exporter imports its
        # driver lazily so its allowlist can be read without one.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Snapshot privacy and shape checks
        # These need no Neo4j: they read the committed snapshot.
        run: pytest tests/test_public_snapshot.py -q
      - name: Snapshot is present, public, and non-trivial
        run: |
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("web/public/data/graph.json").read_text())
          if data.get("profile") != "public":
              sys.exit(
                  f"snapshot profile is {data.get('profile')!r}, not 'public'. "
                  "The organizer export carries volunteer availability and skills "
                  "and must not be deployed."
              )
          if not data["meetings"] or not data["workgroups"]:
              sys.exit("snapshot is empty; refusing to deploy")
          print(f"snapshot: {data['summary']}")
          PY

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5

      - name: Build the docs
        run: |
          pip install zensical
          zensical build

      - name: Assemble the site
        run: |
          rm -rf _site
          cp -R web/public _site
          cp -R site _site/docs
          test -f _site/index.html
          test -f _site/docs/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
