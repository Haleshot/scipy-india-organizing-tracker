name: Deploy dashboard to GitHub Pages

# Deploys web/public as-is, using the snapshot committed at
# web/public/data/graph.json. No credentials, no Neo4j, no LLM: the fixture
# snapshot in the repository is enough for the site to build and be useful.
#
# To publish a snapshot from real data, run the refresh workflow (or the
# exporter locally), commit the regenerated graph.json, and push.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Snapshot privacy and shape checks
        # These do not need Neo4j: they read the committed snapshot.
        run: pytest tests/test_public_snapshot.py -q
      - name: Snapshot is present, public, and non-trivial
        run: |
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("web/public/data/graph.json").read_text())
          if data.get("profile") != "public":
              sys.exit(
                  f"snapshot profile is {data.get('profile')!r}, not 'public'. "
                  "The organizer export carries volunteer availability and skills "
                  "and must not be deployed."
              )
          if not data["meetings"] or not data["workgroups"]:
              sys.exit("snapshot is empty; refusing to deploy")
          print(f"snapshot: {data['summary']}")
          PY

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public
      - id: deployment
        uses: actions/deploy-pages@v4
