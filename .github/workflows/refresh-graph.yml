name: Refresh the graph from Drive

# Keeps the published dashboard current without anybody running anything.
#
# The graph is derived entirely from the sources, so it does not need to
# survive between runs: this starts a throwaway Neo4j beside the job, builds
# the whole graph into it, exports the snapshot, and throws the database away.
# That removes the usual blocker, which is that a container on your laptop is
# not reachable from a GitHub runner.
#
# Two repository secrets are needed, and only two:
#
#   GOOGLE_SERVICE_ACCOUNT_JSON     the whole JSON key file, pasted as-is
#   GOOGLE_DRIVE_ROOT_FOLDER_IDS    comma-separated folder ids
#
#     gh secret set GOOGLE_SERVICE_ACCOUNT_JSON < secrets/your-key.json
#     gh secret set GOOGLE_DRIVE_ROOT_FOLDER_IDS --body "id-one,id-two"
#
# Issues come from the repo's own GITHUB_TOKEN, so nothing extra is needed for
# them. No model runs: the deterministic parser and exact name matching need no
# API key, and nothing is sent anywhere except Google and GitHub.

on:
  schedule:
    # Every three hours. Cheap, because a run with no edits re-reads the Doc,
    # matches every meeting against its cache and writes nothing.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Rebuild from scratch rather than incrementally"
        type: boolean
        default: false

# A push made with the default GITHUB_TOKEN deliberately does not trigger other
# workflows, so this cannot rely on pages.yml noticing the commit. It publishes
# the result itself, sharing the `pages` concurrency group so the two never run
# at the same time.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/scipyindia
          NEO4J_server_memory_heap_max__size: 1G
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p scipyindia 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Write the service-account key
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is not set. See the header of this file." >&2
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$KEY" > secrets/service-account.json
          python -c "import json;json.load(open('secrets/service-account.json'))"

      - name: Check the Drive setup before building anything
        env:
          GOOGLE_SERVICE_ACCOUNT_CREDENTIAL: ./secrets/service-account.json
          GOOGLE_DRIVE_ROOT_FOLDER_IDS: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_IDS }}
        run: python scripts/check_drive.py

      - name: Build the graph and export the snapshot
        env:
          MEETING_NOTES_SOURCE: google_drive
          GOOGLE_SERVICE_ACCOUNT_CREDENTIAL: ./secrets/service-account.json
          GOOGLE_DRIVE_ROOT_FOLDER_IDS: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_IDS }}
          # The parser and exact name matching. No model, no API key, and
          # nothing from the notes leaves this runner.
          MEETING_EXTRACTOR: markdown
          PERSON_RESOLUTION: exact
          VOLUNTEER_SOURCE: none
          ISSUE_SOURCE: github
          GITHUB_REPOS: scipy-india/planning
          GITHUB_ISSUE_LABELS: conference
          GITHUB_TOKEN: ${{ github.token }}
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: scipyindia
          NEO4J_DATABASE: neo4j
        run: |
          # The database is new every run, so there is never useful cached state.
          ./scripts/refresh.sh --reset --no-search

      - name: Commit the snapshot if it changed
        id: commit
        run: |
          if git diff --quiet -- web/public/data/graph.json; then
            echo "The notes and the tracker have not changed. Nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/graph.json
          git commit -m "chore: refresh the snapshot from Drive"
          git push
          git push

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main rather than the commit this workflow started from, so the
      # snapshot the refresh job just pushed is the one that gets published.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Build the docs
        run: |
          pip install zensical
          zensical build
      - name: Assemble the site
        run: |
          rm -rf _site
          cp -R web/public _site
          cp -R site _site/docs
          test -f _site/index.html
          test -f _site/docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
