name: Build the docs

# Validation only. The docs are published by pages.yml, which assembles them
# under /docs/ alongside the dashboard, because a repository gets one Pages
# deployment and two workflows publishing separately would overwrite each other.
#
# This runs on pull requests so a broken nav or a bad link is caught before it
# reaches main.

on:
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zensical
      - run: zensical build
      - name: The nav must not point at pages that do not exist
        run: |
          python - <<'PY'
          import pathlib, sys, tomllib
          config = tomllib.loads(pathlib.Path("zensical.toml").read_text())

          def iter_nav_targets(node):
              if isinstance(node, str):
                  yield node
              elif isinstance(node, list):
                  for item in node:
                      yield from iter_nav_targets(item)
              elif isinstance(node, dict):
                  for item in node.values():
                      yield from iter_nav_targets(item)

          missing = [
              target
              for target in iter_nav_targets(config["project"]["nav"])
              if not (pathlib.Path("docs") / target).is_file()
          ]
          if missing:
              sys.exit(f"nav points at missing pages: {missing}")
          print(f"{len(config['project']['nav'])} nav entries, all present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7
